<style>
@font-face{
  font-family:"Anybody";
  src:url("/anybody.woff2") format("woff2-variations");
  font-weight:100 900; font-stretch:50% 150%; font-display:swap;
}
@font-face{
  font-family:"Archivo";
  src:url("/archivo.woff2") format("woff2-variations");
  font-weight:400 900; font-stretch:62% 125%; font-display:swap;
}
:root{
  --ground:#070B1A; --chassis:#101833; --seam:#5670AB; --signal:#F2A81C;
  --signal-under:#7A4A05; --legend:#EAF0FF; --legend-2:#98A6C8; --ink:#0A0A0A;
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--legend);
  font-family:"Archivo",system-ui,sans-serif; font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column}
.wrap{max-width:1200px; margin:0 auto; padding:0 clamp(20px,4vw,40px); width:100%}
.rail{border-bottom:1px solid #172244}
.rail .in{display:flex; align-items:center; height:56px}
.mark{display:inline-flex; align-items:center; gap:11px; text-decoration:none;
  color:var(--legend); font-family:"Anybody",sans-serif; font-weight:800;
  font-stretch:118%; font-size:20px; letter-spacing:.005em}
.mark img{width:28px; height:28px; display:block; flex:none}
main{flex:1; display:flex; align-items:center; padding:clamp(48px,10vw,120px) 0}
h1{font-family:"Anybody",sans-serif; font-weight:800; font-stretch:125%;
  font-size:clamp(34px,5vw,60px); line-height:.94; letter-spacing:-.02em;
  margin:0 0 20px; max-width:16ch}
p{font-size:19px; color:var(--legend-2); max-width:54ch; margin:0 0 28px}
.acts{display:flex; gap:12px; flex-wrap:wrap}
.pill{display:inline-block; text-decoration:none; border-radius:999px; padding:13px 22px;
  font-size:15px; font-weight:700; border:2px solid var(--signal); background:var(--signal);
  color:var(--ink); box-shadow:0 4px 0 var(--signal-under);
  transition:transform .06s linear, box-shadow .06s linear}
.pill:active{transform:translateY(4px); box-shadow:0 0 0 var(--signal-under)}
.ghost{display:inline-block; text-decoration:none; padding:13px 22px; font-size:15px;
  font-weight:700; border:2px solid var(--seam); color:var(--legend); background:transparent;
  transition:border-color .12s linear}
.ghost:hover{border-color:var(--legend)}
:focus-visible{outline:3px solid var(--signal); outline-offset:3px}
@media (prefers-reduced-motion:reduce){ .pill{transition:none} }
footer{background:var(--chassis); border-top:1px solid var(--seam); padding:24px 0 32px;
  font-size:14px; color:var(--legend-2)}
footer nav{display:flex; gap:16px; flex-wrap:wrap}
footer a{color:var(--legend-2); text-decoration:none}
footer a:hover{color:var(--legend)}
</style>
</head>

    </div>
  </div>

</html>
