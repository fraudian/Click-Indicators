<title>Set a new password — Click Indicators</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root{
    --ink:#0A0D13; --raised:#141A26; --line:#1F2836; --line-soft:#171E2B;
    --text:#EDF1F7; --muted:#8894AA; --dim:#5C687D; --cue:#2FDE74; --bad:#FF6B6B;
    --display:"Segoe UI Variable Display","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light){
    :root{ --ink:#FBFCFD; --raised:#FFF; --line:#DCE2EB; --line-soft:#E9EDF3;
           --text:#0A0D13; --muted:#56627A; --dim:#8894AA; --cue:#12A855; }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:
      radial-gradient(900px 460px at 20% -10%, rgba(47,222,116,.09), transparent 62%),
      radial-gradient(800px 420px at 90% 4%, rgba(74,120,255,.11), transparent 64%), var(--ink);
    background-attachment:fixed;color:var(--text);font-family:var(--display);line-height:1.6;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:14px;
        background:var(--raised);padding:30px;box-shadow:0 30px 70px -34px rgba(60,110,255,.5)}
  h1{font-size:24px;letter-spacing:-.03em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 20px}
  a{color:var(--cue)}
  label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
        text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
  input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
        background:color-mix(in srgb,var(--ink) 60%,transparent);color:var(--text);
        font-family:var(--display);font-size:15px}
  input:focus{outline:2px solid var(--cue);outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;cursor:pointer;
         background:var(--cue);color:#04120A;font-family:var(--display);font-weight:700;font-size:15px}
  button:disabled{opacity:.55;cursor:default}
  .msg{margin-top:14px;font-size:14px;min-height:20px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--cue)}
  .foot{margin-top:18px;font-size:14px;color:var(--muted);text-align:center}
  .hide{display:none}
</style>

<div class="card">
  <h1 id="title">Set a new password</h1>
  <p class="sub" id="sub">Pick something you'll remember. It works on the site and in the game.</p>

  <div id="form">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
    <label for="pw2">Again</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Same thing">
    <button id="go" type="button">Save it</button>
  </div>

  <div class="msg" id="msg"></div>
  <p class="foot"><a href="/account.html">Back to your account</a></p>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function say(t, cls){ $("msg").textContent = t || ""; $("msg").className = "msg " + (cls || ""); }

  var token = new URLSearchParams(location.search).get("t") || "";
  if (!token) {
    $("form").classList.add("hide");
    $("title").textContent = "Link isn't valid";
    $("sub").innerHTML = 'That link is missing its code. Ask for a new one from the ' +
                         '<a href="/account.html">sign-in page</a>.';
  }

  $("go").onclick = async function(){
    var a = $("pw").value, b = $("pw2").value;
    if (a.length < 8) { say("Password needs to be at least 8 characters.", "err"); return; }
    if (a !== b) { say("Those two don't match.", "err"); return; }
    $("go").disabled = true; say("Saving…");
    var r = await fetch("/api/reset", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token: token, password: a }),
      credentials: "same-origin"
    });
    var d = await r.json().catch(function(){ return {}; });
    if (!d.ok) { $("go").disabled = false; say(d.error || "Couldn't save that.", "err"); return; }
    // Deliberately not signed in automatically: a reset kills every session and device, so
    // sending them to sign in proves the new password works while it is still fresh in mind.
    $("form").classList.add("hide");
    $("title").textContent = "Done";
    $("sub").innerHTML = 'Password changed. <a href="/account.html">Sign in</a> with it, then ' +
                         'sign in again inside Geometry Dash - the reset signed the game out too.';
    say("");
  };
})();
</script>
